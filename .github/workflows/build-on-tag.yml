name: Build and Release APK

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download keystore file
        run: echo "${{ secrets.KEYSTORE_FILE_CONTENT }}" | base64 --decode > ${{ github.workspace }}/release.keystore
        env:
          KEYSTORE_FILE_CONTENT: ${{ secrets.KEYSTORE_FILE_CONTENT }}

      - name: Build APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: List APK files
        run: ls -la app/build/outputs/apk/release/

      - name: Generate release notes
        id: release_notes
        run: |
          # Get the previous tag
          previous_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # Generate commit messages since last tag
          if [ -n "$previous_tag" ]; then
            commit_messages=$(git log ${previous_tag}..HEAD --pretty=format:"- %s")
          else
            commit_messages=$(git log --pretty=format:"- %s")
          fi

          # Create release notes
          echo "## Changes" > release_notes.txt
          echo "" >> release_notes.txt
          echo "$commit_messages" >> release_notes.txt

      - name: Build update manifest
        run: |
          read -r version_code version_name < <(./gradlew -q printVersionInfo | tail -1)
          # The manifest published now, for its version history. Absent on the
          # first run, and a 404 page must not end up parsed as one.
          curl -sfL -o previous-manifest.json \
            "https://github.com/${{ github.repository }}/releases/download/latest/update-manifest.json" \
            || echo "no published manifest yet"
          python3 scripts/build-update-manifest.py \
            "$version_code" "$version_name" \
            app/build/outputs/apk/release/app-release.apk \
            release_notes.txt \
            "$([ -f previous-manifest.json ] && echo previous-manifest.json || echo -)" \
            update-manifest.json \
            "${{ github.repository }}"
          cat update-manifest.json

      - name: Delete existing latest release
        continue-on-error: true
        run: gh release delete latest -y
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release from tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release_notes.txt
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-release.apk
            update-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          body_path: release_notes.txt
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-release.apk
            update-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}