# Smoke test: a real server accepts our credentials and the app reaches home.
#
#   scripts/maestro-run.sh .maestro/login-smoke.yaml
appId: com.paulohenriquesg.fahrenheit
name: Login smoke
---
- runFlow:
    file: login.yaml
    env:
      ABS_HOST: ${ABS_HOST}
      ABS_USERNAME: ${ABS_USERNAME}
      ABS_PASSWORD: ${ABS_PASSWORD}

# The home view rendering proves libraries and the personalized shelves loaded,
# not merely that the screen swapped.
- assertVisible:
    id: "home_view"
