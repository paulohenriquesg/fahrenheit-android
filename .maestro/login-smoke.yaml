# Login smoke test: proves a real server accepts our credentials and the app
# reaches the home screen.
#
# Selectors are testTag ids, never visible text, so copy changes and
# localization cannot break the suite.
#
# Two TV-specific things this flow depends on, both learned the hard way:
#
# 1. Tapping a Compose field does NOT move focus on TV, so taps are not used;
#    the remote's D-pad and centre key drive the flow. Each step of the form
#    puts focus on its first field itself.
#
# 2. Enter walks the form: in the address it continues to the sign-in step,
#    which puts focus on the username (#132); in the username it moves to the
#    password; in the password it signs in. That is why this asserts
#    `focused` before typing - it fails loudly rather than silently typing
#    into nothing.
#
# Device setup (once per emulator/device): scripts/maestro-setup.sh
#
#   maestro test .maestro/login-smoke.yaml \
#     -e ABS_HOST="$ABS_HOST" -e ABS_USERNAME="$ABS_USERNAME" -e ABS_PASSWORD="$ABS_PASSWORD"
appId: com.paulohenriquesg.fahrenheit
name: Login smoke
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "login_screen"
    timeout: 40000

# First run lists the servers that answer on this network (#101). The flow
# always types its address, so it walks down to "Enter an address instead";
# a server found on the emulator's network would sit above it.
- extendedWaitUntil:
    visible:
      id: "login_manual_address"
    timeout: 20000
- repeat:
    times: 10
    while:
      notVisible:
        id: "login_manual_address"
        focused: true
    commands:
      - pressKey: "Remote Dpad Down"
- pressKey: "Remote Dpad Center"

- assertVisible:
    id: "login_host_field"
    focused: true
- inputText: ${ABS_HOST}

- pressKey: Enter
- assertVisible:
    id: "login_username_field"
    focused: true
- inputText: ${ABS_USERNAME}

- pressKey: Enter
- assertVisible:
    id: "login_password_field"
    focused: true
- inputText: ${ABS_PASSWORD}

# The password field's imeAction is Done, which signs in. hideKeyboard is not
# usable here - this IME exposes no standard dismiss action.
- pressKey: Enter

# Reaching the home screen proves the server accepted the credentials, the
# token was stored, and the libraries request succeeded.
- extendedWaitUntil:
    visible:
      id: "main_screen"
    timeout: 40000
