# Every browse view loads from a real server.
#
# These four screens were converted from Retrofit callbacks to suspend calls and
# are at 0% unit coverage - their repositories are tested, the screens are not.
# This is what actually proves they still render.
#
#   scripts/maestro-run.sh .maestro/browse-views.yaml
appId: com.paulohenriquesg.fahrenheit
name: Browse views
---
- runFlow:
    file: login.yaml
    env:
      ABS_HOST: ${ABS_HOST}
      ABS_USERNAME: ${ABS_USERNAME}
      ABS_PASSWORD: ${ABS_PASSWORD}

- assertVisible:
    id: "home_view"

# The drawer opens on the Menu key only (MainScreen handles Key.Menu); D-pad
# left does not open it. It closes on selection, so reopen before each choice.
- pressKey: "Remote Menu"
- assertVisible:
    id: "menu_item_series"
- tapOn:
    id: "menu_item_series"
- extendedWaitUntil:
    visible:
      id: "series_view"
    timeout: 30000

- pressKey: "Remote Menu"
- tapOn:
    id: "menu_item_collections"
- extendedWaitUntil:
    visible:
      id: "collections_view"
    timeout: 30000

- pressKey: "Remote Menu"
- tapOn:
    id: "menu_item_authors"
- extendedWaitUntil:
    visible:
      id: "authors_view"
    timeout: 30000

- pressKey: "Remote Menu"
- tapOn:
    id: "menu_item_stats"
- extendedWaitUntil:
    visible:
      id: "stats_view"
    timeout: 30000
